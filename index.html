<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Investing</title>
<meta name="description" content="Invest on your own, follow investors, or invest together as a group, with your approval on every trade.">
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Space+Grotesk:wght@500..700&display=swap">
<style>
:root{
  --ink:#14213d; --paper:#f2f4f8; --surface:#ffffff; --surface-2:#f7f8fb; --line:#e1e5ed;
  --text:#18202e; --muted:#5b6577; --blue:#2f6fe4; --blue-soft:#e6eefc; --ember:#f28c38; --ember-ink:#a9530f; --ember-soft:#fdeedf;
  --gain:#12805a; --loss:#c2413a; --nav:#14213d; --nav-text:#c9d1e0;
  --r-sm:10px; --r-md:16px; --r-lg:22px;
  --f-ui:'DM Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --f-num:'Space Grotesk', 'DM Sans', system-ui, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1526; --surface:#162038; --surface-2:#1b2742; --line:#273452; --text:#e8ecf4; --muted:#9aa6bd;
    --blue:#6b9cf5; --blue-soft:#1d2d52; --ember-ink:#f5a868; --ember-soft:#3a2a1c; --gain:#3fbf8a; --loss:#f07a72; --nav:#0b1120;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1526; --surface:#162038; --surface-2:#1b2742; --line:#273452; --text:#e8ecf4; --muted:#9aa6bd;
  --blue:#6b9cf5; --blue-soft:#1d2d52; --ember-ink:#f5a868; --ember-soft:#3a2a1c; --gain:#3fbf8a; --loss:#f07a72; --nav:#0b1120;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--paper); color:var(--text); font-family:var(--f-ui); font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
a{color:var(--blue); text-decoration:none}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:6px}
.num{font-family:var(--f-num); font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.gain{color:var(--gain)} .loss{color:var(--loss)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.shell{display:grid; grid-template-columns:1fr; min-height:100vh}
.rail{display:none}
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 18px; background:var(--paper); border-bottom:1px solid var(--line)}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--f-num); font-weight:700; font-size:19px; color:var(--text)}
.mark{width:30px; height:30px; border-radius:9px; background:var(--ink); display:grid; place-items:center; color:#fff; font-size:15px; font-weight:700; position:relative}
.mark::after{content:""; position:absolute; right:-3px; bottom:-3px; width:11px; height:11px; border-radius:50%; background:var(--ember); border:2px solid var(--paper)}
.session{display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); white-space:nowrap}
.dot{width:8px; height:8px; border-radius:50%; background:var(--muted)}
.dot.on{background:var(--gain); box-shadow:0 0 0 3px color-mix(in srgb, var(--gain) 25%, transparent)}
main{padding:18px 18px 110px; max-width:860px; width:100%; margin:0 auto}
.bottomnav{position:fixed; left:0; right:0; bottom:0; z-index:30; display:grid; grid-template-columns:repeat(5,1fr); background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
.bottomnav a{display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 4px 10px; font-size:12px; color:var(--muted); position:relative}
.bottomnav a.on{color:var(--blue)}
.bottomnav svg, .rail svg{width:22px; height:22px}
.badge{position:absolute; top:5px; left:calc(50% + 6px); min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--ember); color:#1b1206; font-size:11px; font-weight:700; display:grid; place-items:center}
@media (min-width:960px){
  .shell{grid-template-columns:248px minmax(0,1fr)}
  .rail{display:flex; flex-direction:column; gap:6px; position:sticky; top:0; height:100vh; padding:22px 16px; background:var(--nav); color:var(--nav-text)}
  .rail .brand{color:#fff; margin:0 8px 22px}
  .rail .mark::after{border-color:var(--nav)}
  .rail a.nav{display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; color:var(--nav-text); font-weight:500; position:relative}
  .rail a.nav:hover{background:rgba(255,255,255,.06)}
  .rail a.nav.on{background:rgba(255,255,255,.1); color:#fff}
  .rail .badge{position:static; margin-left:auto}
  .rail .session{color:var(--nav-text); margin:auto 12px 4px}
  .topbar{display:none}
  .bottomnav{display:none}
  main{padding:34px 40px 60px}
}

/* type */
h1,h2,h3{font-family:var(--f-num); margin:0; letter-spacing:-.01em}
h1{font-size:28px; line-height:1.15}
h2{font-size:21px; line-height:1.2}
h3{font-size:17px; line-height:1.25}
.pagehead{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:4px 0 18px}
.pagehead p{margin:4px 0 0}
section.block{margin-top:26px}
section.block > header{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px}

/* surfaces */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg)}
.list{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden}
.row{display:flex; align-items:center; gap:14px; padding:14px 18px; border-top:1px solid var(--line); color:var(--text)}
.row:first-child{border-top:none}
a.row:hover{background:var(--surface-2)}
.row .grow{flex:1; min-width:0}
.row .r{text-align:right}
.sym{font-family:var(--f-num); font-weight:700}
.ellip{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.small{font-size:13px}
.tag{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:600; background:var(--surface-2); color:var(--muted); border:1px solid var(--line); white-space:nowrap}
.tag.blue{background:var(--blue-soft); color:var(--blue); border-color:transparent}
.tag.ember{background:var(--ember-soft); color:var(--ember-ink); border-color:transparent}
.avatar{width:38px; height:38px; border-radius:50%; flex:none; display:grid; place-items:center; color:#fff; font-weight:700; font-size:14px; font-family:var(--f-num)}
.avatar.sm{width:30px; height:30px; font-size:12px}
.avatar.lg{width:64px; height:64px; font-size:22px}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid transparent; border-radius:12px; padding:10px 16px; font-weight:600; font-size:15px; background:var(--blue); color:#fff; white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent; color:var(--text); border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.ember{background:var(--ember); color:#1b1206}
.btn.sm{padding:7px 12px; font-size:14px; border-radius:10px}
.btn[disabled]{opacity:.45; cursor:not-allowed; filter:none}
.seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:3px; gap:2px}
.seg button{border:0; background:transparent; padding:7px 14px; border-radius:9px; font-weight:600; font-size:14px; color:var(--muted)}
.seg button.on{background:var(--surface); color:var(--text); box-shadow:0 1px 2px rgba(20,33,61,.12)}
.tabs{display:flex; gap:22px; border-bottom:1px solid var(--line); margin:18px 0 16px; overflow-x:auto}
.tabs a{padding:10px 0; color:var(--muted); font-weight:600; border-bottom:2px solid transparent; white-space:nowrap}
.tabs a.on{color:var(--text); border-color:var(--text)}

/* forms */
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px}
.field label{font-size:14px; font-weight:600}
.input, select.input, textarea.input{width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:12px; background:var(--surface); font-size:16px}
textarea.input{resize:vertical; min-height:84px}
.hint{font-size:13px; color:var(--muted)}

/* portfolio hero */
.hero{padding:22px 22px 14px; position:relative; overflow:hidden}
.hero .value{font-family:var(--f-num); font-weight:700; font-size:44px; line-height:1.05; letter-spacing:-.02em; margin:6px 0 4px}
@media (min-width:600px){ .hero .value{font-size:56px} }
.hero .spark{display:block; width:100%; height:96px; margin-top:10px}
.hero .actions{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap}

/* approval card — the signature element */
.approval{border:1px solid color-mix(in srgb, var(--ember) 55%, var(--line)); background:linear-gradient(180deg, var(--ember-soft), var(--surface) 70%); border-radius:var(--r-lg); padding:18px; display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:start}
.approval + .approval{margin-top:12px}
.ring{width:64px; height:64px; position:relative}
.ring svg{width:64px; height:64px; transform:rotate(-90deg)}
.ring .t{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--f-num); font-weight:700; font-size:14px; color:var(--ember-ink)}
.approval h3{margin-bottom:4px}
.approval .facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px 16px; margin:12px 0 14px}
.approval .facts div span{display:block; font-size:12px; color:var(--muted)}
.approval .facts div b{font-family:var(--f-num); font-size:16px}
.approval .acts{display:flex; gap:10px; flex-wrap:wrap}
.done{opacity:.85}

/* feed */
.post{padding:16px 18px; border-top:1px solid var(--line)}
.post:first-child{border-top:none}
.post .meta{display:flex; align-items:center; gap:10px}
.post .body{margin:10px 0 8px; white-space:pre-wrap; overflow-wrap:anywhere}
.post .chip{display:inline-flex; gap:8px; align-items:center; padding:7px 11px; border-radius:12px; background:var(--surface-2); border:1px solid var(--line); font-size:14px; margin-bottom:8px}
.post .bar{display:flex; gap:18px; font-size:14px; color:var(--muted)}
.post .bar button{background:none; border:0; padding:4px 0; color:var(--muted); display:inline-flex; gap:6px; align-items:center}
.post .bar button.on{color:var(--loss)}
.comments{margin-top:10px; padding-left:14px; border-left:2px solid var(--line); display:flex; flex-direction:column; gap:10px}
.composer{padding:14px 18px; display:flex; gap:12px; align-items:flex-start}
.composer .grow{flex:1}
.composer textarea{min-height:64px}

/* tally */
.tally{height:10px; border-radius:6px; background:var(--surface-2); overflow:hidden; display:flex; margin:10px 0 6px}
.tally .y{background:var(--gain)} .tally .n{background:var(--loss)} .tally .a{background:var(--muted); opacity:.5}

/* modal */
.scrim{position:fixed; inset:0; z-index:50; background:rgba(10,16,30,.45); display:flex; align-items:flex-end; justify-content:center}
.sheet{background:var(--surface); width:100%; max-width:520px; max-height:92vh; overflow:auto; border-radius:24px 24px 0 0; padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){ .scrim{align-items:center} .sheet{border-radius:24px} }
.sheet header{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px}
.x{border:0; background:var(--surface-2); width:34px; height:34px; border-radius:50%; font-size:18px}
.est{display:flex; justify-content:space-between; padding:12px 14px; background:var(--surface-2); border-radius:12px; margin:4px 0 14px; font-size:15px}

/* toast */
.toasts{position:fixed; z-index:60; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:8px; width:min(92vw,440px)}
@media (min-width:960px){ .toasts{bottom:28px} }
.toast{background:var(--ink); color:#fff; border-radius:14px; padding:12px 14px; display:flex; gap:12px; align-items:center; box-shadow:0 10px 30px rgba(10,16,30,.25); animation:pop .22s ease-out}
.toast.ember{background:var(--ember); color:#1b1206}
.toast .grow{flex:1}
.toast button{background:rgba(255,255,255,.18); border:0; color:inherit; padding:6px 10px; border-radius:9px; font-weight:600}
.toast.ember button{background:rgba(0,0,0,.12)}
@keyframes pop{from{transform:translateY(8px); opacity:0} to{transform:none; opacity:1}}
@media (prefers-reduced-motion: reduce){ .toast{animation:none} }

.banner{display:flex; gap:12px; align-items:center; padding:12px 16px; border-radius:var(--r-md); background:var(--blue-soft); color:var(--text); margin-bottom:16px; font-size:15px}
.banner.ember{background:var(--ember-soft)}
.empty{padding:28px 20px; text-align:center; color:var(--muted)}
.grid2{display:grid; gap:16px}
@media (min-width:760px){ .grid2{grid-template-columns:1fr 1fr} }
.chart{width:100%; height:180px; display:block}
.kv{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:14px; padding:16px 18px}
.kv span{display:block; font-size:13px; color:var(--muted)}
.kv b{font-family:var(--f-num); font-size:18px}
.loading{min-height:60vh; display:grid; place-items:center; color:var(--muted)}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Main"></nav>
  <div>
    <header class="topbar" id="topbar"></header>
    <main id="view"><div class="loading">Loading Pocket Investing…</div></main>
  </div>
</div>
<nav class="bottomnav" id="bottomnav" aria-label="Main"></nav>
<div id="modal"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
/* =====================================================================
   MARKET — simulated prices (deterministic, same for every viewer)
   ===================================================================== */
const Market = (() => {
  const LIST = [
    ['AAPL','Apple',232],['MSFT','Microsoft',448],['NVDA','NVIDIA',182],['AMZN','Amazon',214],
    ['GOOGL','Alphabet',196],['META','Meta Platforms',612],['TSLA','Tesla',298],['JPM','JPMorgan Chase',262],
    ['V','Visa',334],['KO','Coca-Cola',69],['COST','Costco',912],['NFLX','Netflix',1085],
    ['DIS','Disney',114],['AMD','AMD',198],['XOM','ExxonMobil',116],['JNJ','Johnson & Johnson',164],
    ['SPY','S&P 500 ETF',652],['QQQ','Nasdaq-100 ETF',578],['SCHD','US Dividend Equity ETF',28],['O','Realty Income',58]
  ].map(([s,n,b]) => ({s,n,b}));
  const MAP = Object.fromEntries(LIST.map(t => [t.s, t]));
  function hash(str){ let h = 2166136261; for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rnd(seed){ let t = (seed + 0x6D2B79F5) | 0; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  function priceAt(sym, ms){
    const T = MAP[sym]; if (!T) return 0;
    const m = ms / 60000, h = hash(sym);
    const p1 = rnd(h) * 6.283, p2 = rnd(h + 1) * 6.283, p3 = rnd(h + 2) * 6.283, vol = 0.6 + rnd(h + 3);
    let x = 0.035 * vol * Math.sin(2 * Math.PI * m / (1440 * 9) + p1)
          + 0.018 * vol * Math.sin(2 * Math.PI * m / (1440 * 2.3) + p2)
          + 0.007 * vol * Math.sin(2 * Math.PI * m / (60 * 5.1) + p3);
    const k = Math.floor(m / 15), f = m / 15 - k;
    const n0 = rnd((h + k * 7919) | 0) - 0.5, n1 = rnd((h + (k + 1) * 7919) | 0) - 0.5;
    x += 0.006 * vol * (n0 + (n1 - n0) * f);
    return Math.round(T.b * Math.exp(x) * 100) / 100;
  }
  const price = (sym, now = Date.now()) => priceAt(sym, now);
  const dayChange = (sym, now = Date.now()) => { const a = priceAt(sym, now - 86400000), b = priceAt(sym, now); return a ? b / a - 1 : 0; };
  function series(sym, spanMs, points = 60, now = Date.now()){
    const out = []; for (let i = points - 1; i >= 0; i--) out.push(priceAt(sym, now - spanMs * i / (points - 1))); return out;
  }
  return { LIST, MAP, price, dayChange, series, hash };
})();

/* =====================================================================
   CLOCK — the demo clock is a server setting so everyone sees the same market
   ===================================================================== */
const Clock = (() => {
  let current = 'live';
  function et(ms){
    const parts = new Intl.DateTimeFormat('en-US', { timeZone:'America/New_York', hourCycle:'h23', weekday:'short', hour:'2-digit', minute:'2-digit', second:'2-digit' }).formatToParts(new Date(ms));
    const o = {}; for (const p of parts) o[p.type] = p.value; return { wd:o.weekday, mins: (+o.hour % 24) * 60 + (+o.minute) + (+o.second) / 60 };
  }
  function session(now = Date.now()){
    const m = current;
    if (m === 'open') return { open:true, closeAt: now + 3 * 3600000, label:'Market open', demo:true };
    if (m === 'late') return { open:true, closeAt: now + 3 * 60000, label:'3:57 PM ET', demo:true };
    const e = et(now); const weekday = !['Sat','Sun'].includes(e.wd);
    const open = weekday && e.mins >= 570 && e.mins < 960;
    return { open, closeAt: open ? now + (960 - e.mins) * 60000 : null, label: open ? 'Market open' : 'Market closed', demo:false };
  }
  function canFillNow(now = Date.now()){ const s = session(now); return s.open && s.closeAt - now > 5 * 60000; }
  return { mode: () => current, _set: m => { current = m || 'live'; }, session, canFillNow };
})();

/* =====================================================================
   STORE — talks to the Pocket Investing server. Reads come from a local
   cache kept live over a WebSocket; every action is checked and executed
   on the server, which prices trades and enforces permissions.
   ===================================================================== */
const Store = (() => {
  const COLS = ['profiles','portfolios','groups','memberships','posts','reactions','comments','follows','proposals','votes','copyRequests','trades','copies','reports','joinRequests'];
  const cache = Object.fromEntries(COLS.map(c => [c, new Map()]));
  const listeners = new Set();
  let me = { signedIn:false }, myPid = null, canWrite = false, canEdit = false, ready = false, hasDb = false, viewSaved = null, ws = null;
  const START_CASH = 100000;
  const fail = msg => { const e = new Error(msg); e.userFacing = true; return e; };
  const emit = () => listeners.forEach(fn => { try { fn(); } catch(e){ console.error(e); } });

  function applyChanges(ch){
    for (const c of ch || []){
      if (c.setting){ if (c.setting === 'clock') Clock._set(c.value); continue; }
      if (c.wipe){ if (cache[c.col]) cache[c.col] = new Map(); continue; }
      if (!cache[c.col]) continue;
      if (c.data) cache[c.col].set(c.id, c.data); else cache[c.col].delete(c.id);
    }
    emit();
  }
  async function loadState(){
    const r = await fetch('/api/state', { cache:'no-store' }); if (!r.ok) throw new Error('state ' + r.status);
    const j = await r.json();
    for (const c of COLS) cache[c] = new Map((j.collections[c] || []).map(d => [d.id, d]));
    Clock._set(j.settings && j.settings.clock);
  }
  async function loadMe(){
    me = await fetch('/api/me', { cache:'no-store', credentials:'same-origin' }).then(r => r.json());
    if (!viewSaved){ myPid = me.signedIn ? me.pid : null; canWrite = !!me.signedIn; canEdit = !!me.isAdmin; }
    else viewSaved = { myPid: me.signedIn ? me.pid : null, canWrite: !!me.signedIn, canEdit: !!me.isAdmin };
  }
  function connect(){
    try { ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws'); } catch(e){ return; }
    ws.onmessage = e => { try { const m = JSON.parse(e.data); if (m.type === 'changes') applyChanges(m.changes); } catch(err){} };
    ws.onclose = () => setTimeout(async () => { try { await loadState(); emit(); } catch(e){} connect(); }, 2000 + Math.random() * 2000);
  }
  async function init(){
    try { await Promise.all([loadMe(), loadState()]); hasDb = true; } catch(e){ console.error(e); hasDb = false; }
    ready = true; emit(); if (hasDb) connect();
  }
  async function api(name, args = {}){
    let r, j;
    try { r = await fetch('/api/action/' + name, { method:'POST', credentials:'same-origin', headers:{ 'content-type':'application/json' }, body: JSON.stringify(args) }); j = await r.json(); }
    catch(e){ throw fail('Connection problem. Check your internet and try again.'); }
    if (!r.ok) throw fail(j.error || 'Something went wrong. Try again.');
    applyChanges(j.changes);
    return j.result;
  }
  async function auth(path, body){
    let r, j;
    try { r = await fetch(path, { method:'POST', credentials:'same-origin', headers:{ 'content-type':'application/json' }, body: JSON.stringify(body || {}) }); j = await r.json(); }
    catch(e){ throw fail('Connection problem. Check your internet and try again.'); }

function approvalCard(r){

function live(prices){
  const now = Date.now();
  $$('[data-ring]').forEach(el => { const exp = +el.dataset.exp, st = +el.dataset.start, frac = Math.max(0, Math.min(1, (exp - now) / Math.max(1, exp - st))); const c = el.querySelectorAll('circle')[1]; if (c) c.setAttribute('stroke-dashoffset', String(169.6 * (1 - frac))); const t = el.querySelector('[data-cd]'); if (t) t.textContent = left(exp - now); });
  if (!prices) return;
  $$('[data-px]').forEach(el => el.textContent = usd(Market.price(el.dataset.px)));

          <div class="seg" id="t-by"><button data-k="dollars" class="${st.by === 'dollars' ? 'on' : ''}">Dollars</button><button data-k="shares" class="${st.by === 'shares' ? 'on' : ''}">Shares</button></div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px" id="t-chips">${chips().map(([k, l]) => `<button class="btn sm ${st.chip === k ? '' : 'ghost'}" data-k="${k}" ${st.side === 'sell' && !held() ? 'disabled' : ''}>${l}</button>`).join('')}</div>
        <div class="field"><label for="t-amt" id="t-amt-l">${st.by === 'dollars' ? 'Amount in dollars' : 'Number of shares'}</label><input class="input num" id="t-amt" type="number" min="0" step="any" inputmode="decimal" value="${esc(st.amt)}"><span class="hint" id="t-have"></span></div>
        <div class="est"><span id="t-est-l"></span><b class="num" id="t-est">—</b></div>
        <div class="hint" id="t-after" style="margin:-6px 0 14px"></div>
        ${grp() ? '' : `<div class="field"><label style="display:flex;gap:10px;align-items:center;font-weight:500"><input type="checkbox" id="t-share" ${st.share ? 'checked' : ''}> Share this trade to the feed</label></div>`}
        <div class="field" id="t-note-f" style="${grp() || st.share ? '' : 'display:none'}"><label for="t-note">${grp() ? 'Note to the group (optional)' : 'Note (optional)'}</label><input class="input" id="t-note" value="${esc(st.note || '')}" placeholder="Why this trade"></div>
        <button class="btn ${grp() ? 'ember' : ''}" id="t-rev" style="width:100%">Review order</button>
        <p class="hint" style="text-align:center;margin-top:10px">Market order at the current simulated price. Investing involves risk, including loss of principal.</p>`;
      wireEdit(); upd();
      if (focusAmt){ const a = q('t-amt'); a.focus(); const v = a.value; a.value = ''; a.value = v; }
    }
    function upd(){
      const c = calc(), cash = (pf() || {}).cash || 0, h = held();
      q('t-est-l').textContent = st.by === 'dollars' ? 'Estimated shares' : 'Estimated ' + (st.side === 'buy' ? 'cost' : 'proceeds');
      q('t-est').textContent = st.by === 'dollars' ? shs(c.shares) + ' @ ' + usd(c.px) : usd(c.dollars);
      q('t-have').textContent = st.side === 'buy' ? 'Cash available: ' + usd(cash) : (h ? 'You own ' + shs(h) + ' shares (' + usd(h * c.px) + ')' : "You don't own any " + st.sym + '.');
      let after = '', ok = c.shares > 0;
      if (st.side === 'buy'){ const left = cash - c.dollars; after = left < -0.01 ? "That's more than your available cash." : 'Cash left after this order: ' + usd(Math.max(0, left)); if (left < -0.01) ok = false; }
      else { const keep = Math.max(0, Math.round((h - c.shares) * 1000) / 1000); if (c.shares > h + 0.0005){ after = "That's more shares than you own."; ok = false; } else after = keep > 0 ? "You'll keep " + shs(keep) + ' shares (' + usd(keep * c.px) + ')' : "You'll sell your whole position."; if (!h) ok = false; }
      q('t-after').textContent = after; q('t-after').style.color = ok || !(parseFloat(st.amt) > 0) ? '' : 'var(--loss)';
      q('t-rev').disabled = !ok;
      $$('#t-chips button', root).forEach(b => b.className = 'btn sm ' + (st.chip === b.dataset.k ? '' : 'ghost'));
    }
    function wireEdit(){
      const acct = q('t-acct'); if (acct) acct.onchange = () => { st.acct = acct.value; drawEdit(); };
      q('t-side').onclick = e => { const b = e.target.closest('button'); if (!b || b.dataset.k === st.side) return; st.side = b.dataset.k; st.by = st.side === 'sell' ? 'shares' : 'dollars'; st.amt = ''; st.chip = null; drawEdit(true); };
      q('t-by').onclick = e => { const b = e.target.closest('button'); if (!b || b.dataset.k === st.by) return; const c = calc(); st.by = b.dataset.k; st.amt = c.shares ? String(st.by === 'dollars' ? Math.round(c.dollars * 100) / 100 : c.shares) : ''; st.chip = null; drawEdit(true); };
      q('t-chips').onclick = e => { const b = e.target.closest('button'); if (!b || b.disabled) return; const k = b.dataset.k; st.chip = k;
        if (st.side === 'buy'){ st.by = 'dollars'; st.amt = k === 'max' ? String(Math.floor(((pf() || {}).cash || 0) * 100) / 100) : k; }
        else { st.by = 'shares'; st.amt = String(Math.floor(held() * +k * 1000) / 1000); }
        drawEdit(); };
      q('t-amt').oninput = () => { st.amt = q('t-amt').value; st.chip = null; upd(); };
      const sc = q('t-share'); if (sc) sc.onchange = () => { st.share = sc.checked; q('t-note-f').style.display = sc.checked ? '' : 'none'; };
      const nt = q('t-note'); if (nt) nt.oninput = () => { st.note = nt.value; };
      const qi = q('t-q'), res = q('t-res');
      qi.oninput = () => { st.q = qi.value; const t = st.q.trim().toLowerCase();
        if (!t){ res.style.display = 'none'; return; }
        const hits = Market.LIST.filter(x => x.s.toLowerCase().startsWith(t) || x.n.toLowerCase().includes(t)).slice(0, 6);
        res.style.display = ''; res.innerHTML = hits.map(x => `<button class="row" data-s="${x.s}" style="width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none"><span class="sym" style="width:60px">${x.s}</span><span class="grow ellip">${esc(x.n)}</span><span class="num muted">${usd(Market.price(x.s))}</span></button>`).join('') || '<div class="empty">No matching stock in this demo.</div>'; };
      res.onclick = e => { const b = e.target.closest('[data-s]'); if (!b) return; st.sym = b.dataset.s; st.q = ''; if (st.side === 'sell'){ st.amt = ''; st.chip = null; } drawEdit(true); };
      q('t-rev').onclick = () => drawReview();
    }
    function drawReview(){
      const c = calc(), cash = (pf() || {}).cash || 0, h = held(), n = recipients();
      const rows = [['Account', grp() ? 'Trade for ' + esc(Store.get('groups', st.acct).name) : 'Personal (simulated)'], ['Order', (st.side === 'buy' ? 'Buy ' : 'Sell ') + st.sym + ' at market'], ['Shares', shs(c.shares)], ['Estimated price', usd(c.px)], ['Estimated ' + (st.side === 'buy' ? 'cost' : 'proceeds'), usd(c.dollars)],
        st.side === 'buy' ? ['Cash after', usd(Math.max(0, cash - c.dollars))] : ['Shares after', shs(Math.max(0, Math.round((h - c.shares) * 1000) / 1000))]];
      const frac = st.side === 'sell' && h ? c.shares / h : null;
      const who = grp() ? (n ? `${n} member${n === 1 ? '' : 's'} will get an approval request${frac ? ` to sell ${fracWord(frac)} of their position` : ', sized to their own capital'}.` : 'No members will be asked to copy this yet.')
        : (n ? `${n} ${n === 1 ? 'person copies' : 'people copy'} you and will get an approval request.` : '');
      root.innerHTML = `<header><h2>Review order</h2><button class="x" data-close aria-label="Close">×</button></header>
        <div class="list">${rows.map(([a, b]) => `<div class="row"><div class="grow muted">${a}</div><b class="num">${b}</b></div>`).join('')}</div>
        ${who ? `<div class="banner ember" style="margin:14px 0 0">${who}</div>` : ''}
        <p class="hint" style="margin:14px 0">The price may move slightly before the order fills. ${DISCLOSE}</p>
        <div style="display:flex;gap:10px"><button class="btn ghost" id="t-back">Back</button><button class="btn ${grp() ? 'ember' : ''}" id="t-place" style="flex:1">${grp() ? 'Place group trade' : 'Place order'}</button></div>`;
      root.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
      q('t-back').onclick = () => drawEdit();
      q('t-place').onclick = async () => {
        const c2 = calc(); q('t-place').disabled = true;
        try {
          if (grp()){ const res = await Store.groupTrade(st.acct, me, st.sym, st.side, c2.shares, st.note || ''); closeModal(); toast(`Group trade placed: ${st.side === 'buy' ? 'bought' : 'sold'} ${shs(res.trade.shares)} ${st.sym}. ${res.sent} member${res.sent === 1 ? '' : 's'} asked to approve.`); }
          else { const t = await Store.trade(st.sym, st.side, c2.shares, { share: !!st.share, note: st.note || '' }); closeModal(); toast(`Order filled: ${st.side === 'buy' ? 'bought' : 'sold'} ${shs(t.shares)} ${st.sym} at ${usd(t.price)}.${t.sent ? ` ${t.sent} copier${t.sent === 1 ? '' : 's'} asked to approve.` : ''}`); }
        } catch(e){ q('t-place').disabled = false; errToast(e); }
      };
    }
    drawEdit();
    root.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });
  });

/* ---------- actions ---------- */
async function act(el, ev){
  const a = el.dataset.act, id = el.dataset.id;
  const busy = async fn => { el.disabled = true; try { await fn(); } catch(e){ errToast(e); } finally { el.disabled = false; } };
  switch (a){
    case 'start': return authSheet('signup');
    case 'signin': ev.preventDefault(); return authSheet('login');
    case 'signout': return busy(async () => { await Store.logout(); ui.seenReqs = null; toast('Signed out.'); location.hash = '#/home'; });
    case 'delpost': return busy(async () => { if (!confirm('Delete this post?')) return; await Store.deletePost(id); toast('Post deleted.'); });
    case 'delcomment': return busy(async () => { if (!confirm('Delete this comment?')) return; await Store.deleteComment(id); toast('Comment deleted.'); });
    case 'trade': ev.preventDefault(); if (!Store.get('portfolios', Store.myPid)) return toast('Create your demo account first.'); return tradeSheet({ sym: el.dataset.sym, side: el.dataset.side, gid: el.dataset.gid });
    case 'cfrac': ui.copyFrac[id] = +el.dataset.k; return render();
    case 'cancelq': return busy(async () => { if (!confirm('Cancel this order before the open?')) return; await Store.cancelQueued(id); toast('Order cancelled. Nothing will fill at the open.'); });
    case 'approve': return busy(async () => { const r = await Store.approve(id, ui.copyFrac[id] || 1); toast(r.queued ? 'Approved. It fills at the next market open.' : r.trade ? (r.trade.frac < 0.995 && !r.trade.partial ? `Copied ${fracWord(r.trade.frac)}: ${r.trade.side === 'buy' ? 'bought' : 'sold'} ${shs(r.trade.shares)} ${r.trade.sym} at ${usd(r.trade.price)}.` : r.trade.partial ? `Partly copied: ${r.trade.side === 'buy' ? 'bought' : 'sold'} ${shs(r.trade.shares)} of ${shs(r.trade.requested)} ${r.trade.sym}. Not enough ${r.trade.side === 'buy' ? 'cash' : 'shares'} for the full amount.` : `Copied: ${r.trade.side === 'buy' ? 'bought' : 'sold'} ${shs(r.trade.shares)} ${r.trade.sym} at ${usd(r.trade.price)}.`) : 'Not enough cash or shares to copy this trade.'); });
    case 'decline': return busy(async () => { await Store.decline(id); toast('Declined. Nothing changed in your account.'); });
    case 'like': return busy(() => Store.toggleLike(id));
    case 'comments': ui.openComments.has(id) ? ui.openComments.delete(id) : ui.openComments.add(id); return render();
    case 'comment': return busy(async () => { await Store.comment(id, ui.drafts['c:' + id]); ui.drafts['c:' + id] = ''; });
    case 'post': return busy(async () => { await Store.post(ui.drafts.feed); ui.drafts.feed = ''; toast('Posted.'); });
    case 'gpost': return busy(async () => { const k = 'g:' + el.dataset.gid; await Store.post(ui.drafts[k], el.dataset.gid); ui.drafts[k] = ''; });
    case 'ftab': ev.preventDefault(); ui.feedTab = el.dataset.k; return render();
    case 'span': ui.chartSpan = el.dataset.k; return render();
    case 'follow': return busy(() => Store.follow(id));
    case 'unfollow': return busy(() => Store.unfollow(id));
    case 'join': if (!Store.isPro()) return joinSheet(id); return busy(async () => { await Store.join(id, 'member'); toast('You joined as a member. Group trades will ask for your approval.'); });
    case 'upgrade': return upgradeSheet();
    case 'cancelpro': return busy(async () => { if (!confirm('Cancel Pro? Group memberships become observer and copying stops.')) return; await Store.cancelPro(); toast('Pro cancelled. You are on the free plan.'); });
    case 'copy': if (!Store.isPro()) return upgradeSheet(() => Store.copyInvestor(id).then(() => toast(`You copy ${Store.displayName(id)}. Their trades will ask for your approval.`))); return busy(async () => { await Store.copyInvestor(id); toast(`You copy ${Store.displayName(id)}. Their trades will ask for your approval.`); });
    case 'uncopy': return busy(async () => { await Store.stopCopying(id); toast('Stopped copying.'); });
    case 'report': return reportSheet(id);
    case 'resolvereport': return busy(async () => { await Store.resolveReport(id); toast('Marked as reviewed.'); });
    case 'onb': ui.onb = +el.dataset.k; return render();
    case 'risk': ui.risk = el.dataset.k; return render();
    case 'tipoff': try { localStorage.setItem('pi_install_tip', 'off'); } catch(e){} return render();
    case 'reqjoin': return busy(async () => { await Store.requestJoin(id); toast('Request sent. The owner decides who joins.'); });
    case 'joinyes': return busy(async () => { await Store.decideJoin(id, true); toast('Request approved.'); });
    case 'joinno': return busy(async () => { await Store.decideJoin(id, false); toast('Request declined.'); });
    case 'invite': return inviteSheet(id);
    case 'execprop': return busy(async () => { const g = Store.get('groups', Store.get('proposals', id).gid); const role = (Store.membership(g.id) || {}).role; const res = await Store.executeProposal(id, Store.canTradeFor(role) ? Store.myPid : g.leadPid); toast(`Decision executed: ${res.trade.side === 'buy' ? 'bought' : 'sold'} ${shs(res.trade.shares)} ${res.trade.sym}. ${res.sent} member${res.sent === 1 ? '' : 's'} asked to approve.`); });
    case 'demoexec': return busy(async () => { const res = await Store.executeProposal(id); toast(`${Store.displayName(res.trade.pid)} executed the decision. ${res.sent} member${res.sent === 1 ? '' : 's'} asked to approve.`); });
    case 'demojoins': return busy(async () => { const n = await Store.simulateJoinDecisions(); toast(n ? `${n} request${n === 1 ? '' : 's'} approved by sample owners.` : 'No pending requests to sample-owned groups.'); });
    case 'demoinvites': return busy(async () => { const gid = $('#v-g').value; const n = await Store.simulateInviteJoins(gid, 2); toast(n ? `${n} friend${n === 1 ? '' : 's'} joined from your invite.` : 'All sample friends have already joined.'); });
    case 'resetall': return busy(async () => {
      if (!confirm('Reset the whole demo? Sample data is restored and every account, including yours, starts over with fresh cash. Everyone stays signed in.')) return;
      toast('Resetting the demo…', { ms: 2500 });
      const n = await Store.resetAll(); ui.seenReqs = null; ui.onb = 0; ui.presenter = null; renderPresenter();
      toast(`Demo reset. ${n} sample records restored.`); location.hash = '#/home';
    });
    case 'indtrade': return busy(async () => {
      const pid = $('#i-p').value, sym = $('#i-s').value, side = $('#i-side').value, amt = parseFloat($('#i-amt').value) || 0;
      const shares = Math.floor(amt / Market.price(sym) * 1000) / 1000;
      const t = await Store.personalTrade(pid, sym, side, shares, { share: true, note: $('#i-note').value });
      toast(`${Store.displayName(pid)} ${side === 'buy' ? 'bought' : 'sold'} ${shs(t.shares)} ${sym}. ${t.sent} copier${t.sent === 1 ? '' : 's'} asked to approve.`);
    });
    case 'tour': ui.presenter = null; renderPresenter(); return tourGo(0);
    case 'tnext': return tourGo(ui.tour + 1);
    case 'tback': return tourGo(ui.tour - 1);
    case 'texit': return tourGo(-1);
    case 'presenter': ui.presenter = 0; return presenterGo(0);
    case 'pnext': return presenterGo(ui.presenter + 1);
    case 'pback': return presenterGo(ui.presenter - 1);
    case 'pexit': ui.presenter = null; return renderPresenter();
    case 'leave': return busy(async () => { await Store.leave(id); toast('You left the group.'); });
    case 'copypct': return busy(() => Store.setCopyPct(el.dataset.gid, +el.dataset.k));
    case 'newgroup': return groupSheet();
    case 'newprop': return proposalSheet(el.dataset.gid);
    case 'vote': return busy(async () => { await Store.vote(id, el.dataset.k); toast('Vote recorded.'); });
    case 'closeprop': return busy(async () => { await Store.closeProposal(id); toast('Voting closed.'); });
    case 'bio': return bioSheet();
    case 'clock': return busy(async () => { await Store.setClock(el.dataset.k); toast(el.dataset.k === 'live' ? 'Using real market hours.' : 'Demo clock set for everyone.'); });
    case 'demotrade': return busy(async () => {
      const gid = $('#d-g').value, g = Store.get('groups', gid), sym = $('#d-s').value, side = $('#d-side').value, amt = parseFloat($('#d-amt').value) || 0;
      const shares = Math.floor(amt / Market.price(sym) * 1000) / 1000;
      const res = await Store.groupTrade(gid, g.leadPid, sym, side, shares, $('#d-note').value);
      toast(`${Store.displayName(g.leadPid)} ${side === 'buy' ? 'bought' : 'sold'} ${shs(res.trade.shares)} ${sym}. ${res.sent} approval request${res.sent === 1 ? '' : 's'} sent.`);
    });
    case 'demoapprove': return busy(async () => { const n = await Store.simulateApprovals(el.dataset.gid); toast(n ? `${n} sample member${n === 1 ? '' : 's'} responded.` : 'No sample members have pending requests in that group.'); });
    case 'demovote': return busy(async () => { const n = await Store.simulateVotes(id); toast(n ? `${n} sample member${n === 1 ? '' : 's'} voted.` : 'All sample members have already voted.'); });
    case 'reset': return busy(async () => { if (!confirm('Reset your demo account to $100,000 cash?')) return; await Store.resetMe(); toast('Account reset.'); });
  }
}
document.addEventListener('click', ev => { const el = ev.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT') return; if (el.tagName === 'A') ev.preventDefault(); act(el, ev); });
document.addEventListener('change', ev => { const el = ev.target; if (el.dataset && el.dataset.act === 'setrisk'){ Store.setRisk(el.value).then(() => toast('Investing style updated.'), errToast); return; } if (el.dataset && el.dataset.act === 'role'){ Store.setRole(el.dataset.gid, el.dataset.pid, el.value).then(() => toast('Role updated.'), errToast); } });
document.addEventListener('input', ev => { const el = ev.target; if (el.dataset && el.dataset.draft) ui.drafts[el.dataset.draft] = el.value; });
window.addEventListener('hashchange', () => { closeModal(); window.scrollTo(0, 0); render(); if (route().name === 'notifications') setTimeout(() => Store.markSeen(), 1500); });

/* ---------- viewer tour (read-only, nothing is written) ---------- */
const TOUR = [
  { t:"You're Dan, a group member", say:"Dan has a simulated portfolio and belongs to two investing groups. Everything here is sample data, and nothing you tap changes it.", go:'#/home' },
  { t:'An approval request', say:"Maya, the Lead Trader of Dan's group, just bought MSFT. Dan gets a request sized to his capital and has 30 minutes to approve. Nothing executes without him.", go:'#/inbox' },
  { t:'Inside a group', say:"The group's timeline mixes Lead Trader trades, member posts and votes. The bar under each trade shows how many members copied it.", go:'#/group/g_techmomentum/activity' },
  { t:'Members vote', say:'Owners, Admins and Lead Traders propose trades and rule changes. Members vote, and a passed trade proposal becomes a trade every member can approve.', go:'#/group/g_techmomentum/proposals' },
  { t:'Roles', say:'Each group has an Owner, Admins, a Lead Trader who trades for the group, Members who vote and copy, and Observers who just follow along.', go:'#/group/g_techmomentum/members' },
  { t:'How Dan tracks his group', say:"Dan's copied trades against the Lead Trader's and the S&P 500. Trades he skipped show up as drift.", go:'#/group/g_techmomentum/performance' },
  { t:'The social feed', say:'Investors share ideas and trades. Anyone can follow an investor, or copy their trades individually with the same approval step.', go:'#/feed' },
  { t:'Copying one investor', say:"Maya's profile: her return, top holdings and posts. Pro members can copy her trades, approving each one.", go:'#/u/demo_maya' },
  { t:'The weekly digest', say:"Every Monday, members get their week: group trades, their copy rate, votes waiting on them and how they're tracking.", go:'#/digest' },
  { t:'How Pocket makes money', say:'The app is free to start. Pro ($9.99 a month) unlocks full group membership, copying and performance tracking. Group owners pay $19.99 a month for Group Pro.', go:'#/home', after: () => upgradeSheet() },
  { t:"That's the tour", say:'Individual investing, copying one investor, and investing together as a group, with member approval on every trade. Pocket Investing is raising a seed round to build the native app.', go:'#/home' }
];
async function tourGo(i){
  closeModal();
  if (i < 0 || i >= TOUR.length){ ui.tour = null; Store.setViewAs(null); ui.seenReqs = null; renderTour(); location.hash = '#/home'; return render(); }
  if (ui.tour == null){ Store.setViewAs('demo_dan'); ui.seenReqs = null; }
  ui.tour = i; renderTour();
  location.hash = TOUR[i].go; render();
  if (TOUR[i].after) setTimeout(TOUR[i].after, 120);
}
function renderTour(){
  let el = document.getElementById('tourbar');
  if (ui.tour == null){ if (el) el.remove(); return; }
  if (!el){ el = document.createElement('div'); el.id = 'tourbar'; document.body.appendChild(el); }
  const i = ui.tour, s = TOUR[i];
  el.setAttribute('style', 'position:fixed;z-index:56;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));width:min(94vw,620px);background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 12px 32px rgba(10,16,30,.3)');
  el.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span style="font-size:13px;color:#c9d1e0">Tour: ${i + 1} of ${TOUR.length}</span><button data-act="texit" style="background:none;border:0;color:#c9d1e0;font-size:13px">Exit tour</button></div>
    <div style="height:4px;background:rgba(255,255,255,.15);border-radius:2px;margin:8px 0 6px"><div style="height:4px;width:${(i + 1) / TOUR.length * 100}%;background:var(--ember);border-radius:2px"></div></div>
    <div style="font-family:var(--f-num);font-weight:700;font-size:18px">${esc(s.t)}</div><div style="font-size:14px;color:#dfe5f0;margin-top:4px">${esc(s.say)}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">${i > 0 ? '<button class="btn sm ghost" data-act="tback" style="color:#fff;border-color:rgba(255,255,255,.3)">Back</button>' : ''}<button class="btn sm ember" data-act="tnext">${i === TOUR.length - 1 ? 'Finish' : 'Next'}</button></div>`;
}

/* ---------- presenter mode ---------- */
const until = async (fn, ms = 4000) => { const t = Date.now(); while (!fn() && Date.now() - t < ms) await new Promise(r => setTimeout(r, 60)); };
const PRESENT = [
  { t:'Your portfolio', say:'Every user starts with simulated cash. This is the individual side of the app: a portfolio, holdings and markets.', go: async () => { if (!Store.get('profiles', Store.myPid)) await Store.ensureMe(); location.hash = '#/home'; } },
  { t:'The social feed', say:'Investors share ideas and trades. You can follow them, comment, and copy an individual investor.', go: async () => { location.hash = '#/feed'; } },
  { t:'A group', say:'Groups have roles: an Owner, Admins, a Lead Trader who trades for the group, and Members who vote and copy.', go: async () => { location.hash = '#/group/g_techmomentum'; } },
  { t:'The Pro upgrade', say:'Full membership is part of Pro, $9.99 a month. This is where the business model shows up in the product.', go: async () => { location.hash = '#/group/g_techmomentum'; await new Promise(r => setTimeout(r, 80)); if (!Store.membership('g_techmomentum') || Store.membership('g_techmomentum').role === 'observer'){ if (Store.isPro()) await Store.join('g_techmomentum', 'member'); else joinSheet('g_techmomentum'); } } },
  { t:'The Lead Trader trades', say:"Maya buys for the group. Her order fills in her own account, and every member gets an approval request sized to their capital.", go: async () => {
      closeModal(); if (!Store.isPro()){ await Store.upgradePro(); } if (!Store.membership('g_techmomentum') || Store.membership('g_techmomentum').role === 'observer') await Store.join('g_techmomentum', 'member');
      await until(() => Store.isPro() && (Store.membership('g_techmomentum') || {}).role === 'member');
      if (Clock.mode() === 'live' && !Clock.canFillNow()){ await Store.setClock('open'); await until(() => Clock.mode() === 'open'); }
      const g = Store.get('groups', 'g_techmomentum'); const sym = ['AAPL','MSFT','GOOGL','AMZN','NVDA'][Math.floor(Math.random() * 5)];
      await Store.groupTrade('g_techmomentum', g.leadPid, sym, 'buy', Math.floor(8000 / Market.price(sym) * 1000) / 1000, `Adding ${'$' + sym} at about 8% of the portfolio. Approve if it fits your plan.`);
      location.hash = '#/group/g_techmomentum/activity'; } },
  { t:'You approve', say:'Nothing executes without the member. Approve within 30 minutes, or 5 minutes before the close. Late-day trades can be bought at the next open.', go: async () => { location.hash = '#/inbox'; } },
  { t:'The group responds', say:'Other members approve or decline. The Lead Trader sees how many copied.', go: async () => { await Store.simulateApprovals('g_techmomentum'); location.hash = '#/group/g_techmomentum/activity'; } },
  { t:'Members vote', say:'Trade ideas and strategy changes go to a vote. Owners, Admins and Lead Traders propose; members decide.', go: async () => { const n = await Store.simulateVotes('pr_amd', 1); await until(() => Store.tally('pr_amd').cast >= 4 || n === 0, 3000); const pr = Store.get('proposals', 'pr_amd'); if (pr && pr.status === 'open'){ await Store.closeProposal('pr_amd'); await until(() => Store.get('proposals', 'pr_amd').status !== 'open'); } location.hash = '#/group/g_techmomentum/proposals'; } },
  { t:'The decision becomes a trade', say:'Once the vote passes, the Lead Trader executes it. Every member gets an approval request, so the group decides and each person still controls their own account.', go: async () => { await until(() => Store.tally('pr_amd') && Store.tally('pr_amd').closed); const pr = Store.get('proposals', 'pr_amd'); if (pr && !pr.executed && Store.tally('pr_amd').result === 'passed') await Store.executeProposal('pr_amd'); location.hash = '#/group/g_techmomentum/activity'; } },
  { t:'How you track the group', say:'Pro members see their copied trades against the Lead Trader and the S&P 500. Skipped trades show up as drift.', go: async () => { location.hash = '#/group/g_techmomentum/performance'; } },
  { t:"That's the product", say:'Invest on your own, follow and copy investors, or invest together in a group, all with member approval on every trade.', go: async () => { location.hash = '#/home'; } }
];
async function presenterGo(i){
  if (i < 0 || i >= PRESENT.length){ ui.presenter = null; return renderPresenter(); }
  ui.presenter = i; renderPresenter(true);
  try { await PRESENT[i].go(); } catch(e){ errToast(e); }
  renderPresenter();
}
function renderPresenter(busy){
  let el = document.getElementById('presenter');
  if (ui.presenter == null){ if (el) el.remove(); return; }
  if (!el){ el = document.createElement('div'); el.id = 'presenter'; document.body.appendChild(el); }
  const i = ui.presenter, s = PRESENT[i];
  el.setAttribute('style', 'position:fixed;z-index:55;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));width:min(94vw,640px);background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 12px 32px rgba(10,16,30,.3)');
  el.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span style="font-size:13px;color:#c9d1e0">Presenter: step ${i + 1} of ${PRESENT.length}</span><button data-act="pexit" style="background:none;border:0;color:#c9d1e0;font-size:13px">Exit</button></div>
    <div style="font-family:var(--f-num);font-weight:700;font-size:18px;margin-top:4px">${esc(s.t)}</div><div style="font-size:14px;color:#dfe5f0;margin-top:4px">${esc(s.say)}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">${i > 0 ? '<button class="btn sm ghost" data-act="pback" style="color:#fff;border-color:rgba(255,255,255,.3)">Back</button>' : ''}<button class="btn sm ember" data-act="pnext" ${busy ? 'disabled' : ''}>${i === PRESENT.length - 1 ? 'Finish' : 'Next'}</button></div>`;
}

/* ---------- notifications for new approval requests ---------- */
function watchRequests(){
  const pend = Store.myPending();
  if (ui.seenReqs === null){ if (Store.ready) ui.seenReqs = new Set(pend.map(r => r.id)); return; }
  for (const r of pend){
    if (ui.seenReqs.has(r.id)) continue; ui.seenReqs.add(r.id);
    const g = r.gid && Store.get('groups', r.gid);
    toast(`${Store.displayName(r.leaderPid)} ${r.side === 'buy' ? 'bought' : 'sold'} ${r.sym}${g ? ' for ' + g.name : ''}. Approve to copy.`, { tone:'ember', href:'#/inbox', label:'Review', ms:9000 });
  }
}

/* ---------- boot ---------- */
Store.subscribe(() => { watchRequests(); schedule(); });
render();
Store.init().then(render, e => { console.error(e); render(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
setInterval(() => { tick++; live(tick % 5 === 0); if (tick % 15 === 0){ Store.housekeeping(); renderNav(); } if (tick % 60 === 0) schedule(); }, 1000);

</script>
</body>
</html>
